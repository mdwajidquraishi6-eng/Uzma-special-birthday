HTML

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Uzma ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #170b14, #3b1028, #160b18);
    color: white;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.container {
    padding: 25px;
}

.heart {
    font-size: 48px;
    animation: beat 1.5s infinite;
}

h1 {
    color: #ffb5d1;
    font-size: 42px;
    margin: 20px 0;
}

h2 {
    font-size: 30px;
    margin-bottom: 18px;
}

p {
    color: #f5cddd;
    font-size: 18px;
    line-height: 1.7;
}

.rose {
    font-size: 65px;
    margin: 20px;
}

button {
    margin-top: 30px;
    padding: 15px 28px;
    border: none;
    border-radius: 30px;
    background: #e94d91;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #ff75ae;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}
</style>
</head>

<body>
<div class="container">

    <div class="heart">❤️</div>

    <h1>Dear Uzma</h1>

    <h2>Happy Birthday! 🎂</h2>

    <p>
    You are my favourite person...<br>
    Today and always. ❤️
    </p>

    <div class="rose">🌹</div>

    <button>Open Your Surprise 💌</button>

</div>
</body>
</html>
